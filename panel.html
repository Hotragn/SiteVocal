<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteVocal</title>
  <link rel="icon" href="icons/icon-32.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F8F9FA; color-scheme: light; }
    html[data-surface="popup"] body { width: 420px; height: 600px; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #F8F9FA; }
  </style>
</head>
<body>
  <!--
    SiteVocal extension shell. The studio UI is index.html — the very same page
    you can double-click as a web app — loaded as an MV3 sandboxed page, isolated
    from the extension APIs. All of its code ships in this package (app.js,
    vendor/readability.min.js, vendor/styles.css) and runs under the sandbox
    policy script-src 'self'. panel.js gives it a private MessageChannel for tab
    access, privileged fetch, storage, Chrome's on-device Summarizer and (only
    with a key you saved) the optional Turbo Engine endpoint.
  -->
  <iframe id="app" src="index.html?host=extension" title="SiteVocal studio" allow="autoplay; clipboard-write"></iframe>
  <script src="panel.js"></script>
</body>
</html>
